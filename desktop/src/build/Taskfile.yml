version: "3"

# Shell UI is Go-embedded HTML (desktop/src/assets). No Vite/npm frontend.

tasks:
  go:mod:tidy:
    summary: Runs go mod tidy
    internal: true
    run: once
    cmds:
      - go mod tidy

  install:frontend:deps:
    summary: Builds the embedded-assets development server
    cmds:
      - go build -o .task/devserver.exe ./cmd/devserver

  build:frontend:
    summary: No Vite build (assets embedded)
    cmds:
      - echo "embedded assets; skip vite"

  generate:bindings:
    summary: Bindings unused (Call.ByName)
    cmds:
      - echo "skip generate bindings"

  brand:
    summary: Generates branded build assets from desktop/branding.json
    dir: build
    cmds:
      - |
        if python3 -c "import PIL" >/dev/null 2>&1; then
          python3 apply_branding.py
        elif command -v uv >/dev/null 2>&1; then
          uv run --no-project --with pillow python apply_branding.py
        else
          echo "apply_branding.py needs Pillow: python3 -m pip install pillow (or install uv)." >&2
          exit 1
        fi

  generate:icons:
    summary: Generates .ico from the branded app icon
    dir: build
    deps:
      - brand
    sources:
      - branding/appicon.png
    generates:
      - windows/icon.ico
    cmds:
      # Windows / Linux keep the full-bleed artwork.
      - wails3 generate icons -input branding/appicon.png -windowsfilename windows/icon.ico -macfilename ""

  generate:icons:darwin:
    summary: Generates .icns from the branded macOS icon via sips + iconutil
    dir: build
    deps:
      - brand
    sources:
      - branding/appicon-macos.png
    generates:
      - darwin/icons.icns
    cmds:
      # macOS expects 824x824 artwork on a 1024x1024 canvas; a full-bleed tile
      # renders ~24% larger than every other app in the Dock and Launchpad.
      #
      # sips downsamples through Core Graphics. wails3's encoder resizes with
      # Mitchell-Netravali, which rings on the logo's high-contrast edges and
      # leaves stray pixels in the 32/64/128 layers.
      - |
        set -euo pipefail
        work="$(mktemp -d "${TMPDIR:-/tmp}/octop-iconset.XXXXXX")"
        trap 'rm -rf "$work"' EXIT
        iconset="${work}/AppIcon.iconset"
        mkdir -p "$iconset"
        for spec in 16:icon_16x16 32:icon_16x16@2x 32:icon_32x32 64:icon_32x32@2x \
                    128:icon_128x128 256:icon_128x128@2x 256:icon_256x256 \
                    512:icon_256x256@2x 512:icon_512x512 1024:icon_512x512@2x; do
          px="${spec%%:*}"
          sips -s format png -z "$px" "$px" branding/appicon-macos.png \
            --out "${iconset}/${spec#*:}.png" >/dev/null
        done
        iconutil -c icns "$iconset" -o darwin/icons.icns

  dev:frontend:
    summary: Serves the embedded shell assets for Wails dev mode
    deps:
      - task: install:frontend:deps
    cmds:
      - ./.task/devserver.exe

  update:build-assets:
    summary: Updates generated build assets from config.yml
    dir: build
    cmds:
      - wails3 update build-assets -name "{{.APP_NAME}}" -binaryname "{{.APP_NAME}}" -config config.yml -dir .
